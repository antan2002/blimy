name: Extensions

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - ".github/workflows/extensions.yml"
  pull_request:
    paths:
      - "extensions/**"
      - ".github/workflows/extensions.yml"
  workflow_dispatch:

jobs:
  validate:
    if: github.repository == 'antan2002/blimy' || github.repository == 'blimydev/blimy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Prepare generated extension CDN output
        run: bun run extensions:prepare

      - name: Validate extensions
        run: bun run extensions:validate

      - name: Check generated source changes
        run: |
          git diff --exit-code extensions package.json .gitignore || (
            echo "Extension source or generated metadata changed. Run the extension scripts locally."
            exit 1
          )

  package-databases:
    if: github.repository == 'antan2002/blimy' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: extension-database-sidecars

      - name: Prepare generated extension CDN output
        run: bun run extensions:prepare

      - name: Build database sidecar packages
        run: |
          test "$(uname -m)" = "arm64"
          bun run extensions:package:databases --build --platform darwin-arm64 --target-dir target/database-sidecars
          bun run extensions:stage
          bun run extensions:catalog

      - name: Validate packaged extensions
        run: |
          bun run extensions:validate
          bun run extensions:verify-cdn --local

      - uses: actions/upload-artifact@v4
        with:
          name: extensions-cdn
          path: extensions/generated/cdn/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'antan2002/blimy' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, package-databases]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/download-artifact@v4
        with:
          name: extensions-cdn
          path: extensions/generated/cdn/

      - name: Check CDN configuration
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EXTENSIONS_CDN_PUBLIC_URL }}" ]; then
            echo "Missing EXTENSIONS_CDN_PUBLIC_URL."
            echo "Set it to the bucket's public origin and use the same value for"
            echo "extensionsCdnBaseUrl in src/config/services.json."
            exit 1
          fi

      # The bucket must have public access enabled. `extensionsCdnBaseUrl` in
      # src/config/services.json must be that bucket's public origin, because the app and
      # `extensions:verify-cdn` both read it from there.
      - name: Deploy extensions CDN
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          rclone config create r2 s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --non-interactive

          rclone sync extensions/generated/cdn/ "r2:${R2_BUCKET}/" \
            --checksum --delete-after --verbose

      - name: Verify installable packages on CDN
        run: bun run extensions:verify-cdn
