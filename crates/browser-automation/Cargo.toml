[package]
name = "blimy-browser-automation"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
headless_chrome = "1.0"
chrono = { version = "0.4", features = ["serde"] }
