[package]
name = "blimy-debugger"
version = "0.1.0"
repository = "https://github.com/antan2002/blimy"
homepage = "https://github.com/antan2002/blimy#readme"
authors = ["antan2002 <antanroy502@gmail.com>"]
license = "AGPL-3.0"
edition = "2024"

[features]
default = ["tauri-wry"]
tauri-wry = ["tauri/wry", "tauri/x11"]
linux = ["tauri/cef"]

[dependencies]
anyhow = "1.0"
blimy-runtime = { path = "../runtime" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", default-features = false, features = ["test"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
